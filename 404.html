<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페이지를 찾을 수 없습니다 | 인스모바일 요금제</title>
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="2;url=/GitHub/">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  background:linear-gradient(180deg,#eef4ff 0%,#f7fbff 42%,#ffffff 100%);
  color:#17233b;min-height:100vh;
  -webkit-text-size-adjust:100%;
  padding:22px 16px 40px;
}
.wrap{max-width:520px;margin:0 auto}
.brand{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:700;color:#1a56db;letter-spacing:-0.2px;margin-bottom:18px}
.brand span.dot{width:7px;height:7px;border-radius:50%;background:#22c55e;display:inline-block}
.card{background:#fff;border-radius:20px;padding:26px 20px 22px;box-shadow:0 10px 30px rgba(23,52,110,.10);border:1px solid #e6eefb}
.badge{display:inline-block;background:#eaf1ff;color:#1a56db;font-size:12px;font-weight:800;border-radius:999px;padding:5px 11px;letter-spacing:-0.2px}
.badge.hot{background:#fff7ed;color:#b45309;border:1px solid #fed7aa}
.spec{margin:12px 0 0;padding:11px 13px;background:#f3f8ff;border:1px solid #dbe8fd;border-radius:12px;font-size:13px;line-height:1.65;color:#274b8a;font-weight:600;word-break:keep-all}
h1{font-size:24px;line-height:1.32;margin:12px 0 6px;letter-spacing:-0.8px;font-weight:800}
.price{font-size:32px;font-weight:900;color:#0b1b3a;letter-spacing:-1.2px;margin:2px 0 4px}
.price small{font-size:15px;font-weight:700;color:#64748b;letter-spacing:0}
.note{font-size:14px;color:#5b6b85;margin:8px 0 0;line-height:1.55}
.hint{margin:16px 0 0;background:#f3f8ff;border:1px solid #dbe8fd;border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.6;color:#274b8a}
.btns{margin-top:20px;display:flex;flex-direction:column;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;border-radius:14px;padding:17px 14px;font-size:17px;font-weight:800;letter-spacing:-0.4px;border:0;width:100%;cursor:pointer;font-family:inherit;
  -webkit-tap-highlight-color:transparent}
.btn-primary{background:#1a56db;color:#fff;box-shadow:0 6px 16px rgba(26,86,219,.28)}
.btn-primary:active{background:#1444b0}
.btn-sub{background:#fff;color:#1a56db;border:1.5px solid #bcd0f5}
.btn-sub:active{background:#eef4ff}
.btn-ghost{background:#f1f5f9;color:#334155}
.btn-ghost:active{background:#e2e8f0}
.small{font-size:12.5px;color:#8a97ad;text-align:center;margin-top:10px;line-height:1.6}
.divider{height:1px;background:#eef2f8;margin:20px 0 16px}
.contact{font-size:14px;line-height:1.9;color:#334155;text-align:center}
.contact a{color:#1a56db;font-weight:800;text-decoration:none}
.foot{margin-top:18px;text-align:center;font-size:12px;color:#94a3b8;line-height:1.7}
.loading{text-align:center;padding:28px 6px 6px}
.spinner{width:34px;height:34px;border:3px solid #dbe8fd;border-top-color:#1a56db;border-radius:50%;margin:0 auto 14px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{font-size:15px;color:#334155;font-weight:700;margin:0 0 6px;letter-spacing:-0.3px}
.loading .sub{font-size:13px;color:#7b8aa3;font-weight:500}
.planlist{display:flex;flex-direction:column;gap:9px;margin-top:6px}
.plan{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:1px solid #e6eefb;border-radius:14px;padding:14px 15px;text-decoration:none;color:#17233b}
.plan:active{background:#f4f8ff}
.plan .l{display:flex;flex-direction:column;gap:3px;min-width:0}
.plan .nm{font-size:15.5px;font-weight:800;letter-spacing:-0.4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.plan .nm em{font-style:normal;font-size:11px;font-weight:800;color:#fff;background:#22c55e;border-radius:999px;padding:2px 7px}
.plan .pr{font-size:13px;color:#64748b;font-weight:700}
.plan .go{flex:0 0 auto;font-size:13px;font-weight:800;color:#1a56db;background:#eef4ff;border-radius:999px;padding:8px 12px;white-space:nowrap}
.sec-title{font-size:13px;font-weight:800;color:#64748b;margin:22px 4px 8px;letter-spacing:-0.2px}
.top-card{background:#fff;border-radius:18px;padding:20px 18px;border:1px solid #e6eefb;box-shadow:0 8px 24px rgba(23,52,110,.07);margin-bottom:6px}
.top-card h1{font-size:21px;margin:0 0 8px}
.top-card p{margin:0;font-size:13.5px;color:#5b6b85;line-height:1.7}
.kbd{display:inline-block;background:#eef4ff;color:#1a56db;border-radius:6px;padding:1px 6px;font-weight:800;font-size:12.5px}
</style></head>
<body><div class="wrap"><div class="card">
<h1>페이지를 찾을 수 없습니다</h1>
<p class="note">요금제 목록 페이지로 이동합니다.</p>
<div class="btns"><a class="btn btn-primary" href="/GitHub/">요금제 목록으로 가기</a></div>
</div></div></body></html>
